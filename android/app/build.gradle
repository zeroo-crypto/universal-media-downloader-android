plugins {
    id "com.android.application"
    id "kotlin-android"
    id "dev.flutter.flutter-gradle-plugin"
}

def localProperties = new Properties()
def localPropertiesFile = rootProject.file('local.properties')
if (localPropertiesFile.exists()) {
    localPropertiesFile.withReader('UTF-8') { reader ->
        localProperties.load(reader)
    }
}

def flutterVersionCode = localProperties.getProperty('flutter.versionCode')
if (flutterVersionCode == null) {
    flutterVersionCode = '1'
}

def flutterVersionName = localProperties.getProperty('flutter.versionName')
if (flutterVersionName == null) {
    flutterVersionName = '1.0'
}

def keystorePropertiesFile = rootProject.file('key.properties')
def keystoreProperties = new Properties()
if (keystorePropertiesFile.exists()) {
    keystorePropertiesFile.withReader('UTF-8') { reader ->
        keystoreProperties.load(reader)
    }
} else {
    def appKeystorePropertiesFile = project.file('key.properties')
    if (appKeystorePropertiesFile.exists()) {
        appKeystorePropertiesFile.withReader('UTF-8') { reader ->
            keystoreProperties.load(reader)
        }
        keystorePropertiesFile = appKeystorePropertiesFile
    }
}

android {
    namespace "com.zeroo.universal_media_downloader"
    compileSdk flutter.compileSdkVersion
    ndkVersion flutter.ndkVersion

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }

    kotlinOptions {
        jvmTarget = '1.8'
    }

    defaultConfig {
        applicationId "com.zeroo.universal_media_downloader"
        minSdk 24
        targetSdk flutter.targetSdkVersion
        versionCode flutterVersionCode.toInteger()
        versionName flutterVersionName
        multiDexEnabled true
    }

    signingConfigs {
        release {
            def resolvedStoreFile = null
            if (keystorePropertiesFile.exists() && keystoreProperties.containsKey('storeFile')) {
                def rawPath = keystoreProperties['storeFile']
                if (rawPath != null && !rawPath.trim().isEmpty()) {
                    def directFile = file(rawPath)
                    if (directFile.exists()) {
                        resolvedStoreFile = directFile
                    } else {
                        def rootRelative = rootProject.file(rawPath)
                        if (rootRelative.exists()) {
                            resolvedStoreFile = rootRelative
                        }
                    }
                }
            }

            if (resolvedStoreFile != null && resolvedStoreFile.exists()) {
                keyAlias keystoreProperties['keyAlias']
                keyPassword keystoreProperties['keyPassword']
                storeFile resolvedStoreFile
                storePassword keystoreProperties['storePassword']
            } else {
                // Fallback to deterministic project release keystore
                storeFile file('release.keystore')
                storePassword 'universal_media_downloader'
                keyAlias 'universal_media_key'
                keyPassword 'universal_media_downloader'
            }

            v1SigningEnabled true
            v2SigningEnabled true
            v3SigningEnabled true
        }
    }

    buildTypes {
        release {
            signingConfig signingConfigs.release
            minifyEnabled false
            shrinkResources false
        }
    }

    packagingOptions {
        pickFirst 'lib/arm64-v8a/libc++_shared.so'
        pickFirst 'lib/armeabi-v7a/libc++_shared.so'
        pickFirst 'lib/x86_64/libc++_shared.so'
    }
}

flutter {
    source '../..'
}

dependencies {
    implementation "org.jetbrains.kotlin:kotlin-stdlib-jdk8"
}
