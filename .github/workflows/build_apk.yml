name: Build & Release Universal Media Downloader APK

on:
  push:
    branches: [ main, master ]
    tags:
      - 'v*'
  workflow_dispatch: # Allows manual trigger from GitHub Actions tab

permissions:
  contents: write

jobs:
  build:
    name: Build & Publish Android APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Java JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: 'gradle'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Install Dependencies
        run: flutter pub get

      - name: Run Tests
        run: flutter test

      - name: Build Release APKs
        run: |
          flutter build apk --release --split-per-abi
          flutter build apk --release

      - name: Upload APK Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: UniversalMediaDownloader-APKs
          path: |
            build/app/outputs/flutter-apk/app-arm64-v8a-release.apk
            build/app/outputs/flutter-apk/app-armeabi-v7a-release.apk
            build/app/outputs/flutter-apk/app-release.apk
          retention-days: 14

      - name: Publish to GitHub Releases
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.0
          name: "Universal Media Downloader v1.0.0 (Android APK)"
          body: |
            ## 📱 Unduh Aplikasi Android (APK Siap Pasang)

            Selamat datang di rilis resmi **Universal Media Downloader AI Agent untuk Android**!
            Aplikasi ini 100% mandiri (*standalone* on-device) tanpa membutuhkan PC atau server.

            ### 📥 Pilihan Berkas APK:
            - **`app-release.apk` (Universal - Disarankan)**: Dapat dipasang di **SEMUA jenis dan merk HP Android** (Samsung, Xiaomi, Oppo, Vivo, Realme, Infinix, Google Pixel, dll.).
            - **`app-arm64-v8a-release.apk`**: Versi optimal untuk 95%+ HP Android modern (ukuran file lebih ramping).

            ---

            ### 🚀 Panduan Install untuk Pemula:
            1. Klik salah satu file **`.apk`** di bawah (di bagian **Assets**) melalui browser HP Anda.
            2. Setelah unduhan selesai, buka file tersebut.
            3. Jika muncul pemberitahuan keamanan *"Demi keamanan, ponsel Anda tidak diizinkan memasang aplikasi tidak dikenal dari sumber ini"*:
               - Ketuk **Pengaturan (Settings)**.
               - Aktifkan toggle **Izinkan dari sumber ini (Allow from this source)**.
            4. Ketuk **Pasang (Install)** lalu buka aplikasinya.

            ---

            ### ⚡ Cara Memakai:
            - **Cara 1 (Tombol Bagikan / Share)**: Saat sedang menonton YouTube, melihat ilustrasi Pixiv, scrolling Instagram/TikTok/Twitter/Pinterest di HP Anda -> ketuk tombol **Bagikan (Share)** -> pilih **Universal Downloader**.
            - **Cara 2 (Tempel Link)**: Salin tautan media -> buka aplikasi Universal Downloader -> ketuk tombol **Tempel Link**.
          draft: false
          prerelease: false
          files: |
            build/app/outputs/flutter-apk/app-release.apk
            build/app/outputs/flutter-apk/app-arm64-v8a-release.apk
            build/app/outputs/flutter-apk/app-armeabi-v7a-release.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
