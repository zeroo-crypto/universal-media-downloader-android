name: Build & Release Universal Media Downloader APK

on:
  push:
    branches: [ main, master ]
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build & Publish Android APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Java JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: 'gradle'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Install Dependencies
        run: flutter pub get

      - name: Run Tests
        run: flutter test

      - name: Configure Gradle Wrapper Permissions
        run: |
          chmod +x android/gradlew || true

      - name: Build Universal Release APK
        run: |
          mkdir -p staged-apks
          flutter build apk --release --android-skip-build-dependency-validation
          cp build/app/outputs/flutter-apk/app-release.apk staged-apks/app-release.apk

      - name: Build Split-per-ABI Release APKs
        run: |
          flutter build apk --release --split-per-abi --android-skip-build-dependency-validation
          # Restore the staged universal APK so all APK flavors are preserved
          cp staged-apks/app-release.apk build/app/outputs/flutter-apk/app-release.apk

      - name: Sign Release APKs with apksigner (Dual-Scheme v1 + v2)
        run: |
          # Dynamically locate apksigner from Android SDK build-tools
          BUILD_TOOLS_DIR=$(find "${ANDROID_HOME:-/usr/local/lib/android/sdk}/build-tools" -mindepth 1 -maxdepth 1 -type d 2>/dev/null | sort -V | tail -n 1)
          if [ -n "$BUILD_TOOLS_DIR" ] && [ -f "$BUILD_TOOLS_DIR/apksigner" ]; then
            export PATH="$BUILD_TOOLS_DIR:$PATH"
          fi

          APKSIGNER=$(command -v apksigner || echo "$BUILD_TOOLS_DIR/apksigner")
          echo "Using apksigner binary: $APKSIGNER"
          "$APKSIGNER" --version

          KEYSTORE="android/app/release.keystore"
          KS_PASS="pass:universal_media_downloader"
          KEY_ALIAS="universal_media_key"
          KEY_PASS="pass:universal_media_downloader"

          TARGET_APKS=(
            "build/app/outputs/flutter-apk/app-release.apk"
            "build/app/outputs/flutter-apk/app-arm64-v8a-release.apk"
            "build/app/outputs/flutter-apk/app-armeabi-v7a-release.apk"
            "build/app/outputs/flutter-apk/app-x86_64-release.apk"
          )

          for apk in "${TARGET_APKS[@]}"; do
            echo "------------------------------------------------------------"
            echo "Signing $apk with Dual-Scheme (v1 + v2)..."
            "$APKSIGNER" sign \
              --ks "$KEYSTORE" \
              --ks-pass "$KS_PASS" \
              --ks-key-alias "$KEY_ALIAS" \
              --key-pass "$KEY_PASS" \
              --v1-signing-enabled true \
              --v2-signing-enabled true \
              --min-sdk-version 21 \
              "$apk"

            echo "Verifying signature schemes for $apk..."
            "$APKSIGNER" verify --verbose "$apk"
          done

      - name: Verify APK Quality Gate
        run: |
          chmod +x scripts/verify_apk.sh
          ./scripts/verify_apk.sh build/app/outputs/flutter-apk

      - name: Generate SHA-256 Checksums
        run: |
          cd build/app/outputs/flutter-apk
          sha256sum *.apk > SHA256SUMS.txt
          cat SHA256SUMS.txt

      - name: Upload APK Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: UniversalMediaDownloader-APKs
          path: |
            build/app/outputs/flutter-apk/app-release.apk
            build/app/outputs/flutter-apk/app-arm64-v8a-release.apk
            build/app/outputs/flutter-apk/app-armeabi-v7a-release.apk
            build/app/outputs/flutter-apk/app-x86_64-release.apk
            build/app/outputs/flutter-apk/SHA256SUMS.txt
          retention-days: 14

      - name: Publish to GitHub Releases
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.0
          name: "ZALL v1.0.0 (Release)"
          body_path: RELEASE_NOTES.md
          draft: false
          prerelease: false
          files: |
            build/app/outputs/flutter-apk/app-release.apk
            build/app/outputs/flutter-apk/app-arm64-v8a-release.apk
            build/app/outputs/flutter-apk/app-armeabi-v7a-release.apk
            build/app/outputs/flutter-apk/app-x86_64-release.apk
            build/app/outputs/flutter-apk/SHA256SUMS.txt
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
