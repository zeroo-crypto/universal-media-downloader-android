name: universal_media_downloader
description: "Universal Media Downloader AI Agent for Android - Standalone On-Device Media Extractor & Downloader"
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.1.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  # Networking & HTTP Streaming
  dio: ^5.4.3+1
  http: ^1.2.1

  # Background Services & Notifications
  flutter_foreground_task: any
  permission_handler: any

  # Android System & Share Sheet Integration
  receive_sharing_intent: any
  path_provider: any
  open_filex: any

  # Media Processing (FFmpeg for Pixiv Ugoira & Audio)
  ffmpeg_kit_flutter_new: ^4.6.7
  archive: any
  mime: any

  # State Management & Local Storage
  provider: any
  shared_preferences: any
  intl: any

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: any

flutter:
  uses-material-design: true
